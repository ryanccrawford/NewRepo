name: Build Pico 2 UF2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential jq

      - name: Clone Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          git -C "$HOME/pico-sdk" submodule update --init --recursive

      - name: Configure
        run: |
          PICO_SDK_PATH="$HOME/pico-sdk" cmake -S . -B build -G Ninja -DPICO_BOARD=pico2

      - name: Build
        run: |
          cmake --build build

      - name: Verify UF2 exists
        run: |
          test -f build/pico2_display_test.uf2

      - name: Upload UF2 to FlashMyPico
        env:
          FLASHMYPICO_API_KEY: ${{ secrets.FLASHMYPICO_API_KEY }}
        run: |
          PROJECT="pico2_display_test"
          API="https://flashmypico.com/v1/api"
          VERSION="run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"

          PROJECT_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $FLASHMYPICO_API_KEY" \
            "$API/project/$PROJECT")

          PROJECT_STATUS=$(echo "$PROJECT_RESPONSE" | jq -r '.status // empty')

          if [ "$PROJECT_STATUS" != "ok" ]; then
            PROJECT_RESPONSE=$(curl -sS -X POST \
              -d "title=Pico 2 Display Test" \
              -d "device_handle=pico_2" \
              -H "Authorization: Bearer $FLASHMYPICO_API_KEY" \
              "$API/project/$PROJECT")

            PROJECT_STATUS=$(echo "$PROJECT_RESPONSE" | jq -r '.status // empty')

            if [ "$PROJECT_STATUS" != "ok" ]; then
              echo "FlashMyPico project setup failed: $PROJECT_STATUS"
              exit 1
            fi
          fi

          UPLOAD_RESPONSE=$(curl -sS -X POST \
            -F "version=$VERSION" \
            -F "file=@build/pico2_display_test.uf2" \
            -H "Authorization: Bearer $FLASHMYPICO_API_KEY" \
            "$API/project/$PROJECT/builds")

          UPLOAD_STATUS=$(echo "$UPLOAD_RESPONSE" | jq -r '.status // empty')

          if [ "$UPLOAD_STATUS" != "ok" ]; then
            echo "FlashMyPico upload failed: $UPLOAD_STATUS"
            exit 1
          fi

          echo "UF2 uploaded to FlashMyPico as $VERSION"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2-display-test-uf2
          path: build/pico2_display_test.uf2
          if-no-files-found: error
